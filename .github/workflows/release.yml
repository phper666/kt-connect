name: release

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release-cli:
    name: Release packages
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.18
      uses: actions/setup-go@v4
      with:
        go-version: '1.18'
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get go mod cache
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        if [ -f Gopkg.toml ]; then
            curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
            dep ensure
        fi

    # Docker 镜像构建已移除（fork 复用官方 v0.3.7 镜像，无阿里云 registry 推送权限）
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        version: v1.19.2
        args: release --rm-dist ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Homebrew formula 更新已移除（fork 不维护官方 formula）
