# Make sure to check the documentation at http://goreleaser.com
env:
  - GO_VERSION=1.18
before:
  hooks:
    - make mod
    - bash build/scripts/wintun.sh
builds:
  - id: "ktctl"
    main: ./cmd/ktctl/main.go
    # 裸二进制资产名（带平台/版本，直接下载即用）
    binary: >-
      ktctl_{{ .Version }}_
      {{- if eq .Os "darwin" }}MacOS
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "windows" }}Windows
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}arm_64
      {{- else }}{{ .Arch }}{{ end }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - 386
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      # 注意：main.version 必须保持与官方发布一致的版本号（当前 0.3.7）。
      # ktctl 用它拼接 shadow/router 镜像 tag（registry.cn-hangzhou.aliyuncs.com/rdc-incubator/kt-connect-*:v{version}），
      # fork 复用官方镜像；若注入 release tag 会导致镜像 tag 不存在（ImagePullBackOff）。
      - -s -w -X main.version=0.3.7
# shadow/router/navigator 构建与 dockers 段已移除：
# fork 不构建/推送 docker 镜像（无阿里云 registry 权限），复用官方 v0.3.7 镜像
archives:
  - id: ktctl
    builds:
      - ktctl
    # 默认裸二进制直发（Linux/macOS：下载即用，无需解压）；
    # Windows 保留 zip（需随包携带 wintun.dll）
    format: binary
    format_overrides:
      - goos: windows
        format: zip
    # 仅 Windows zip 资产命名使用（binary 模式忽略）
    name_template: >-
      ktctl_{{ .Version }}_
      {{- if eq .Os "darwin" }}MacOS
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "windows" }}Windows
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}arm_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - src: 'artifacts/{{ .Os }}/{{ .Arch }}/*'
        dst: .
        strip_parent: true
checksum:
  name_template: '{{ .Tag }}_checksums.txt'
snapshot:
  name_template: "SNAPSHOT"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^config:'
      - '^refactor:'
release:
  github:
    owner: phper666
    name: kt-connect
  ids:
    - ktctl
  # @see https://github.com/goreleaser/goreleaser/issues/1023
  draft: false
  prerelease: auto
